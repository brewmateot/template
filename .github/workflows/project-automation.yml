name: Project automation

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, labeled]

permissions:
  contents: read

jobs:
  add-to-project:
    name: Add work item to project
    runs-on: ubuntu-latest
    steps:
      - name: Explain required project configuration
        run: |
          echo "Project automation is intentionally disabled until the organization Project URL and a least-privilege token are configured."
          echo "Configure the Project integration before granting this workflow write permissions."
